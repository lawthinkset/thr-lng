name: Daily Long-Form Video with YouTube Upload

on:
  schedule:
    - cron: "15 5 * * *"   # 8:00 AM MSK — one video per day
  workflow_dispatch:
    inputs:
      upload_youtube:
        description: 'Upload to YouTube? (auto = alternate days, true = force yes, false = force skip)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: daily-longform-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu-core

    - name: Cache Vosk Model
      uses: actions/cache@v3
      with:
        path: vosk-model-small-ru-0.22
        key: vosk-ru-model-${{ runner.os }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install --upgrade edge-tts gTTS

    - name: Generate video
      env:
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      run: |
        python main.py

    - name: 📅 Check YouTube upload schedule (Alternate days)
      id: yt_schedule
      env:
        INPUT_UPLOAD_YOUTUBE: ${{ github.event.inputs.upload_youtube }}
      run: |
        python check_schedule.py

    - name: Upload to YouTube
      if: steps.yt_schedule.outputs.should_upload == 'true'
      env:
        UPLOAD_YOUTUBE: ${{ steps.yt_schedule.outputs.should_upload }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: |
        python upload_to_youtube.py

    - name: Upload to Facebook & other platforms
      env:
        IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      run: |
        python upload_all_platforms.py || true

    - name: Commit updated topics and tracking files
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git stash --include-untracked || true
        git pull --rebase origin main || true
        git stash pop || true
        git add topics.txt used_topics.txt used_images.json youtube_history.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "🔄 Auto-update: Track used topics, images, and YouTube schedule [skip ci]"
        git push || true
